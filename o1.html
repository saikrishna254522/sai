<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
</head>

<body style="background-color:#d6f0ff; font-family:Arial, sans-serif;">

<div style="width:350px; margin:60px auto; background:white; padding:25px; border-radius:10px; box-shadow:0px 0px 10px gray; text-align:center;">

    <h2 style="color:#003366;">Student Registration Form</h2>

    <input type="text" id="fname" placeholder="First Name" style="width:90%; padding:10px; border:1px solid gray; border-radius:5px; font-size:15px;"><br><br>

    <input type="text" id="lname" placeholder="Last Name" style="width:90%; padding:10px; border:1px solid gray; border-radius:5px; font-size:15px;"><br><br>

    <input type="text" id="roll" placeholder="Roll Number" style="width:90%; padding:10px; border:1px solid gray; border-radius:5px; font-size:15px;"><br><br>

    <input type="text" id="email" placeholder="Email" style="width:90%; padding:10px; border:1px solid gray; border-radius:5px; font-size:15px;"><br><br>

    <input type="text" id="phone" placeholder="Phone Number" style="width:90%; padding:10px; border:1px solid gray; border-radius:5px; font-size:15px;"><br><br>

    <button onclick="register()" style="width:95%; padding:10px; background:#007BFF; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer;">
        Submit
    </button>

    <p id="message" style="display:none; color:green; font-size:16px; font-weight:bold; margin-top:15px;">
        ✔ Thank You for Registering!
    </p>

</div>

<script>

function register()
{
    var fname = document.getElementById("fname").value;
    var lname = document.getElementById("lname").value;
    var roll = document.getElementById("roll").value;
    var email = document.getElementById("email").value;
    var phone = document.getElementById("phone").value;

    // First Name Validation
    if(!/^[A-Za-z]+$/.test(fname))
    {
        alert("First Name should contain only letters.");
        return;
    }

    // Last Name Validation
    if(!/^[A-Za-z]+$/.test(lname))
    {
        alert("Last Name should contain only letters.");
        return;
    }

    // Roll Number Validation
    if(!/^[A-Za-z0-9]+$/.test(roll))
    {
        alert("Roll Number should contain only letters and numbers.");
        return;
    }

    // Email Validation
    if(email.indexOf("@") == -1)
    {
        alert("Please enter a valid Email.");
        return;
    }

    // Phone Number Validation
    if(!/^[0-9]{10}$/.test(phone))
    {
        alert("Phone Number should contain exactly 10 digits.");
        return;
    }

    // Display Success Message
    document.getElementById("message").style.display = "block";
}

</script>

</body>
</html>
